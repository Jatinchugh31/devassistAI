spring.application.name=devassist
server.port=9090
# use env var OPENAI_API_KEY, safer than hard-coding
spring.ai.openai.api-key=${OPENAI_API_KEY}
# choose a model; you can change later
spring.ai.openai.chat.options.model=gpt-5-mini
spring.ai.openai.chat.options.temperature=1
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000

# RAG Configuration - Choose your approach
# Vector Store Options: SIMPLE, REDIS
devassist.rag.vector-store.type=REDIS
# RAG Approach Options: QUESTION_ANSWER_ADVISOR, VECTOR_STORE_DOCUMENT_RETRIEVER, CUSTOM_PIPELINE
devassist.rag.approach.type=VECTOR_STORE_DOCUMENT_RETRIEVER
# Enable/Disable RAG completely
devassist.rag.enabled=true
devassist.rag.update.metaData= false

# Redis Vector Store Configuration
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=devassist-index
spring.ai.vectorstore.redis.prefix=devassist:embedding:




spring.datasource.url=jdbc:h2:mem:devassist;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Ensure Spring runs schema/data SQL (default in Boot 3 is 'always' only for embedded DB)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Optional: expose H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.root=INFO
logging.level.com.devassist=DEBUG
logging.level.com.devassist.advisor.LogAdvisor=INFO
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

