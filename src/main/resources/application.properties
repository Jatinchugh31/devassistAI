spring.application.name=devassist
server.port=9090
# use env var OPENAI_API_KEY, safer than hard-coding
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
# choose a model; you can change later
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000




spring.datasource.url=jdbc:h2:mem:devassist;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Ensure Spring runs schema/data SQL (default in Boot 3 is 'always' only for embedded DB)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Optional: expose H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.root=INFO
logging.level.com.devassist=DEBUG
logging.level.com.devassist.advisor.LogAdvisor=INFO
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

