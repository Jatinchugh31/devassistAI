plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.devassist'
version = '0.0.1-SNAPSHOT'
description = 'DevAssist - AI powered Spring Boot Assistant'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    // optional milestone/snapshot repos only if you need M/S builds
    // maven { url 'https://repo.spring.io/milestone' }
    // maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
    // Use the Spring AI BOM to manage versions
    implementation platform("org.springframework.ai:spring-ai-bom:1.0.3") // stable release

    // Use the OpenAI starter which transitively provides the ChatClient and model auto-config
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // OR (alternative): bring in the chat client module directly
    // implementation 'org.springframework.ai:spring-ai-client-chat'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // optional: redis if you plan to use ChatMemory repository backed by Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // jackson time module
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


    // Spring JDBC (provides JdbcTemplate and DataSource auto-config)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'com.h2database:h2:2.1.214'

}

tasks.named('test') {
    useJUnitPlatform()
}
